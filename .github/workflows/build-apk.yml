name: Build HT ScorePath CurveStation v4.5.2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'HTScorePath_CurveStation_v4_5_2_ImportFix_OneUpload.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract v4.5.2 source
        shell: bash
        run: |
          set -euo pipefail
          test -f HTScorePath_CurveStation_v4_5_2_ImportFix_OneUpload.zip || { echo 'ERROR: please upload the v4.5.2 ZIP at repo root'; exit 1; }
          unzip -oq HTScorePath_CurveStation_v4_5_2_ImportFix_OneUpload.zip
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f tests/fixtures/v4_4/MonitorService.java

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo 'ANDROID_HOME is not defined'; exit 1; }
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo 'Android API 35 is not installed'; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo 'Android Build Tools 35 are not installed'; exit 1; }
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Run JavaScript regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do node "$f"; done

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HTScorePath-CurveStation-v4.5.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
