
name: Build HT ScorePath CurveStation v4.5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HTScorePath_CurveStation_v4_5_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip sources if uploaded as ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f HTScorePath_CurveStation_v4_5_OneUpload.zip ]]; then
            unzip -oq HTScorePath_CurveStation_v4_5_OneUpload.zip
          fi
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/htlive/monitor/ScoreGuardEngine.java

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check JavaScript logic
        shell: bash
        run: |
          set -euo pipefail
          for testfile in tests/*.test.js; do
            node "$testfile"
          done

      - name: Assemble v4.5 debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload v4.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: HTScorePath-CurveStation-v4.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
